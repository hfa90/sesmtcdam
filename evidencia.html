<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FO-COR-SEG-001 · Lista de presença DDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <style>
    body { background: #e9ece9; }
    .toolbar { position: sticky; top: 0; z-index: 5; background: #0a4d32; color: #fff; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar .spacer { flex: 1; }
    .folha { background: #fff; width: 297mm; min-height: 210mm; margin: 16px auto; padding: 10mm; box-shadow: 0 4px 20px rgba(0,0,0,.12); color: #000; font-size: 10pt; }
    .folha + .folha { page-break-before: always; }
    table.f { width: 100%; border-collapse: collapse; }
    table.f td, table.f th { border: 1px solid #000; padding: 4px 6px; vertical-align: middle; }
    table.f th { background: #d9e8df; font-size: 8.5pt; text-transform: uppercase; }
    .cab td { font-size: 9pt; }
    .cab .tit { font-size: 13pt; font-weight: 800; text-align: center; }
    .lbl { font-size: 7.5pt; font-weight: 700; text-transform: uppercase; color: #333; display: block; }
    .sigimg { height: 34px; max-width: 160px; object-fit: contain; display: block; margin: 0 auto; }
    .lista td { height: 40px; font-size: 9pt; }
    .lista thead { display: table-header-group; }
    .lista tr { page-break-inside: avoid; }
    .conteudo { white-space: pre-wrap; font-size: 9.5pt; }
    .mono { font-size: 7.5pt; }
    .rodape { margin-top: 8px; font-size: 7.5pt; color: #444; }
    @media (max-width: 1100px) { .folha { width: auto; margin: 10px; overflow-x: auto; } }
    @page { size: A4 landscape; margin: 8mm; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .folha { box-shadow: none; margin: 0; width: auto; min-height: auto; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <b>Evidência DDS · FO-COR-SEG-001</b>
    <span class="spacer"></span>
    <button class="btn btn-accent btn-sm" onclick="window.print()">Imprimir / Salvar PDF</button>
    <button class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="window.close()">Fechar</button>
  </div>
  <div id="doc"><div class="empty" style="padding:60px"><span class="spinner"></span> Carregando evidência...</div></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (async function () {
    const { esc, call, fmtData, fmtDataHora, fmtHora } = DDS;
    try { await DDS.exigirSessao(["supervisor", "admin"]); } catch (e) { return; }
    const id = new URLSearchParams(location.search).get("id");
    let d;
    try { d = await call("reuniao_detalhe", { p_reuniao_id: id }); }
    catch (e) { document.getElementById("doc").innerHTML = `<div class="alert alert-danger" style="margin:30px">${esc(DDS.msgErro(e))}</div>`; return; }
    const r = d.reuniao, t = d.tema, ass = d.assinaturas;
    const tec = t.tipo === "tecnico" || t.tipo === "tecnico_comportamental" ? "X" : "&nbsp;&nbsp;";
    const comp = t.tipo === "comportamental" || t.tipo === "tecnico_comportamental" ? "X" : "&nbsp;&nbsp;";
    const ch = `${t.carga_horaria_min} min`;
    const cab = (pag) => `
      <table class="f cab"><tr>
        <td rowspan="3" style="width:16%;text-align:center"><b>SESMT</b><br><span style="font-size:8pt">${esc(CONFIG.UNIDADE)}</span></td>
        <td style="width:46%;text-align:center"><b>FORMULÁRIO</b></td>
        <td colspan="3"><span class="lbl">Código:</span>${esc(CONFIG.FORM_CODIGO)}</td></tr>
        <tr><td><span class="lbl">Título:</span></td><td><span class="lbl">Versão:</span>${esc(CONFIG.FORM_VERSAO)}</td>
          <td><span class="lbl">Data:</span>${esc(CONFIG.FORM_DATA)}</td><td><span class="lbl">Pág.:</span>${pag}</td></tr>
        <tr><td class="tit" colspan="4">LISTA DE PRESENÇA DE TREINAMENTO</td></tr>
      </table>
      <table class="f" style="margin-top:-1px"><tr>
        <td style="width:62%"><span class="lbl">Nome do treinamento realizado</span>DDS – Diálogo Diário de Segurança: <b>${esc(t.titulo)}</b></td>
        <td><span class="lbl">Tipo de treinamento</span>TÉCNICO ( ${tec} ) E/OU COMPORTAMENTAL ( ${comp} )</td></tr></table>`;

    const linhas = ass.map((a, i) => `<tr>
        <td class="center">${i + 1}</td><td>${esc(a.matricula)}</td><td>${esc(a.nome)}</td><td>${esc(a.cargo || "")}</td>
        <td>${esc(a.setor || "")}</td><td><img class="sigimg" src="${a.assinatura}" alt=""></td>
        <td class="center" style="font-size:8pt">${fmtDataHora(a.assinado_em)}</td><td class="center"><b>P</b></td></tr>`).join("");
    const vazias = Array.from({ length: Math.max(0, 3 - ass.length) }, () => `<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join("");

    const pag1 = `<section class="folha">${cab("1/3")}
      <table class="f lista" style="margin-top:-1px"><thead><tr>
        <th style="width:3%">Nº</th><th style="width:8%">Matrícula</th><th style="width:22%">Nome</th><th style="width:16%">Função</th>
        <th style="width:17%">Setor / Empresa</th><th style="width:16%">Assinatura</th><th style="width:12%">Data/Hora</th><th style="width:6%">Presença (P/F)</th>
      </tr></thead><tbody>${linhas}${vazias}</tbody></table>
      <table class="f" style="margin-top:8px"><thead><tr><th>Período</th><th>Data</th><th>Horário</th><th>Carga horária</th><th>Tema do treinamento</th><th>Nome do instrutor</th><th>Visto do instrutor</th></tr></thead>
        <tbody><tr><td class="center">P1</td><td class="center">${fmtData(r.data)}</td><td class="center">${fmtHora(r.horario) || "—"}</td><td class="center">${ch}</td>
        <td>${esc(t.titulo)}</td><td>${esc(r.supervisor_nome)}<br><span style="font-size:8pt">Mat. ${esc(r.supervisor_matricula)}</span></td>
        <td style="width:16%">${r.assinatura_instrutor ? `<img class="sigimg" src="${r.assinatura_instrutor}" alt="">` : '<span style="font-size:8pt">(DDS não encerrado)</span>'}</td></tr></tbody></table>
      <div class="rodape">Total de participantes: <b>${ass.length}</b> · Local: ${esc(r.local || "—")} · Código do DDS: ${esc(r.codigo)} · Assinaturas eletrônicas coletadas pelo sistema DDS SESMT.</div>
    </section>`;

    const pag2 = `<section class="folha">${cab("2/3")}
      <table class="f" style="margin-top:-1px"><tr><th colspan="4" style="text-align:left">Atividades do treinamento</th></tr>
        <tr><td colspan="2"><span class="lbl">Objetivo geral</span>${esc(t.objetivo || "—")}</td><td colspan="2"><span class="lbl">Público alvo</span>${esc(t.publico_alvo || "—")}</td></tr>
        <tr><th style="width:5%">Item</th><th style="width:22%">Treinamento realizado</th><th style="width:10%">Carga horária</th><th>Tópico ministrado, conteúdo e/ou documentação explanada</th></tr>
        <tr><td class="center">1</td><td>DDS – ${esc(t.titulo)}</td><td class="center">${ch}</td><td class="conteudo">${esc(t.conteudo)}${t.material_url ? `\n\nMaterial de apoio: ${esc(t.material_url)}` : ""}${r.observacoes ? `\n\nObservações do instrutor: ${esc(r.observacoes)}` : ""}</td></tr>
        <tr><td colspan="3" class="right"><b>VISTO DO INSTRUTOR:</b></td><td>${r.assinatura_instrutor ? `<img class="sigimg" style="margin:0" src="${r.assinatura_instrutor}" alt="">` : ""} ${esc(r.supervisor_nome)}</td></tr>
      </table></section>`;

    const pag3 = `<section class="folha">${cab("3/3")}
      <table class="f" style="margin-top:-1px"><tr><th colspan="5" style="text-align:left">Registro eletrônico de autenticidade</th></tr>
        <tr><th>Matrícula</th><th>Nome</th><th>Data/hora (Manaus)</th><th>Método</th><th>Código de integridade (SHA-256)</th></tr>
        ${ass.map((a) => `<tr><td>${esc(a.matricula)}</td><td>${esc(a.nome)}</td><td>${fmtDataHora(a.assinado_em)}</td><td>${a.metodo === "quiosque" ? "Dispositivo do supervisor" : "Dispositivo próprio"}</td><td class="mono">${esc(a.hash)}</td></tr>`).join("")}
      </table>
      <div class="rodape">Identificador do DDS: ${esc(r.id)} · Aberto em ${fmtDataHora(r.criado_em)} · ${r.encerrada_em ? "Encerrado em " + fmtDataHora(r.encerrada_em) : "Em aberto"}<br>
      Cada colaborador autenticou-se com matrícula e CPF e assinou manualmente na tela. Os registros são imutáveis no banco de dados.
      Documento gerado em ${fmtDataHora(new Date().toISOString())}.</div></section>`;

    document.getElementById("doc").innerHTML = pag1 + pag2 + pag3;
    document.title = `DDS ${fmtData(r.data)} - ${r.supervisor_nome} - ${t.titulo}`;
  })();
  </script>
</body>
</html>
