<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a4d32" />
  <title>DDS SESMT · Sem conexão</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a4d32; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 1.4rem; margin: 18px 0 8px; }
    p { opacity: .85; max-width: 340px; margin: 0 auto 20px; }
    button { background: #f2b705; color: #2b2200; border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <img src="assets/icons/icon-192.png" alt="" />
    <h1>Sem conexão com a internet</h1>
    <p>Para registrar a presença no DDS é preciso estar conectado. Verifique o Wi-Fi ou os dados móveis e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
